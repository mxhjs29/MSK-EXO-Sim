defaults:
  - conf_fullbody_walk
  - _self_

wandb:
  mode: disabled
  tags: [gait120, emg-comparison]

experiment:
  run_id: gait120_emg_ppo
  checkpoint_root: outputs/gait120_emg_comparison_v1/ppo/checkpoints
  total_timesteps: 2621440000
  total_timesteps_is_absolute: true
  seeds: [42]
  online_logging_interval: 1
  checkpoint_interval: 100
  max_checkpoints_to_keep: 3
  save_checkpoints_on_validation: false
  env_params:
    knee_coupling_consistent: true
    num_envs: 4096
    timestep: 0.002
    n_substeps: 5
    reference_duration: null
    goal_params:
      # 5 future targets at 50 ms intervals fit this 0.95 s reference.
      n_step_stride: 5
    reward_params:
      activation_energy_coeff: 0.0
  task_factory:
    params:
      amass_dataset_conf: null
      custom_dataset_conf:
        traj_path: outputs/gait120_levelwalking/clips/S101_Trial01_Step01/trajectory.npz
        trajectory_cache_type: sparse
  validation:
    active: true
    amass_dataset_conf: null
    interval: 100
    num_steps: 95
    num_envs: 8
    video_length: 95
    video_frequency: 10
    deterministic: true
    start_from_beginning: true
    th_params:
      random_start: false
      fixed_start_conf: [0, 0]
      start_from_random_step: false
